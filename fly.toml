# Hold the Box — API online (WebSocket + Fastify)
# Deploy from repo root: fly deploy --ha=false
app = "hold-the-box-api"
primary_region = "dfw"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  TRUST_PROXY = "true"
  CORS_ORIGIN = "https://jgmaza.github.io"
  LOG_LEVEL = "info"
  TICK_HZ = "60"
  SNAPSHOT_HZ = "30"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
